[package]
name = "tacc-core"
version = "0.1.0"
edition = "2021"
authors = ["Jeffrey Kim <jk9576@hanyang.ac.kr>"]
description = "High-performance Rust implementation of Trilemma-Aware Adaptive Committee Consensus (HotStuff-2, RFC 9381 VRF, Closed-loop Controller)"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
